# yaml-language-server: $schema=
version: ""

run:
  timeout: 5m
  tests: true



linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  cyclop:
    max-complexity: 15
    package-average: 10.0
  funlen:
    lines: 80
    statements: 50
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport
      - ifElseChain
      - octalLiteral
      - whyNoLint
      - wrapperFunc
  goimports:
    local-prefixes: github.com/kaulinmindiola/global-ecommerce-api
  gofmt:
    simplify: true
  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G204
      - G401
  govet:
    enable:
      - shadow
    settings:
      printf:
        funcs:
          - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
          - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
          - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
          - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
  revive:
    min-confidence: 0.8
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unreachable-code
      - name: redefines-builtin-id
  godot:
    scope: declarations
    capital: false
    period: true
  lll:
    line-length: 120
  godox:
    keywords:
      - NOTE
      - OPTIMIZE
      - HACK
      - TODO
      - FIXME
  nilnil:
    checked-types:
      - ptr
      - func
      - iface
      - map
      - chan

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - cyclop
    - funlen
    - gocognit
    - gocyclo
    - gofmt
    - goimports
    - revive
    - bodyclose
    - noctx
    - prealloc
    - gosec
    - copyloopvar
    - godox
    - gocritic
    - misspell
    - unconvert
    - unparam
    - whitespace
  disable:
    - exhaustive
    - wrapcheck
    - gochecknoglobals
    - nlreturn
    - wsl

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
  new: false
  exclude-dirs:
    - api/docs
    - vendor
  exclude-files:
    - ".*_generated\\.go"
  exclude-rules:
    - path: ".*_generated\\.go"
      linters:
        - lll
    - path: "_test\\.go"
      linters:
        - godox
        - funlen
        - gocritic
        - errcheck
    - path: "cmd/api/main.go"
      linters:
        - gochecknoglobals
        - funlen
    - text: "Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.Remove(All)?|.*print(f|ln)?|os\\.(Un)?Setenv). is not checked"
      linters:
        - errcheck
    - path: "internal/handler"
      text: "commentFormatting"
      linters:
        - gocritic
    - text: "unused-parameter"
      linters:
        - revive
