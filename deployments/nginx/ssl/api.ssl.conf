# ==============================================================================
# NGINX - SSL Configuration for VPS / Self-Hosted Deployment
#
# Usage: Referenced by docker-compose.prod.ssl.yaml overlay ONLY.
#        NOT used on Railway, AWS, GCP, Render.
#
# Requires:
#   - /etc/letsencrypt/live/${DOMAIN}/fullchain.pem  (from Certbot)
#   - /etc/letsencrypt/live/${DOMAIN}/privkey.pem    (from Certbot)
# ==============================================================================

limit_req_zone  $binary_remote_addr zone=api_limit:10m  rate=100r/m;
limit_req_zone  $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

upstream ecommerce_api {
    server    api:8080;
    keepalive 32;
}

# HTTP → HTTPS redirect + ACME challenge for Certbot renewal
server {
    listen      80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen      443 ssl;
    http2       on;                          # Correct syntax for nginx >= 1.25.1
    server_name _;
    server_tokens off;

    # --------------------------------------------------------------------------
    # TLS - Mozilla Modern Configuration (TLSv1.3 preferred)
    # Generated via: https://ssl-config.mozilla.org/
    # --------------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/placeholder/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/placeholder/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_session_tickets off;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS - only valid over a real TLS connection to the client
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --------------------------------------------------------------------------
    # Security headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options        "DENY"                              always;
    add_header X-Content-Type-Options "nosniff"                           always;
    add_header X-XSS-Protection       "1; mode=block"                     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1000;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml application/json application/javascript;

    client_max_body_size  10M;
    proxy_read_timeout    30s;
    proxy_connect_timeout 10s;
    proxy_http_version    1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;   # $scheme = "https" since TLS terminates here
    proxy_set_header X-Request-ID      $request_id;

    location = /api/v1/health {
        proxy_pass       http://ecommerce_api;
        proxy_set_header Connection "";
        access_log       off;
    }

    location /swagger/ {
        limit_req  zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;
        proxy_pass http://ecommerce_api;
    }

    location ~ ^/api/v1/auth/(login|register) {
        limit_req        zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        limit_conn       conn_limit 5;
        proxy_pass       http://ecommerce_api;
        add_header       Cache-Control "no-store" always;
    }

    location /api/ {
        limit_req  zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 20;
        proxy_pass       http://ecommerce_api;
        proxy_set_header Connection "";
        add_header       Cache-Control "no-store" always;
    }

    location ~ /\. {
        deny all; access_log off; log_not_found off;
    }

    location ~* \.(env|sql|sh|yaml|yml|toml|git)$ {
        deny all; access_log off; log_not_found off;
    }
}
