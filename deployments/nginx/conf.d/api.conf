# ==============================================================================
# NGINX - Global E-commerce API Reverse Proxy
# Mode: HTTP / Proxy-Aware
#
# Deployment topology:
#
#   [Client] ──HTTPS──► [Railway Edge / ALB : TLS termination]
#                                │
#                        HTTP (internal)
#                                │
#                                ▼
#                       [Nginx :80] ── rate limit, headers, routing
#                                │
#                        HTTP (internal)
#                                │
#                                ▼
#                       [Go API :8080] ── business logic
#
# TLS is NOT managed here. This is intentional:
#   - Railway:   TLS handled automatically by Railway's edge proxy
#   - AWS/GCP:   TLS handled by Application Load Balancer
#   - VPS:       Use docker-compose.prod.ssl.yaml overlay (see /deployments/docker/)
#
# References:
#   - https://docs.railway.app/guides/networking
#   - https://nginx.org/en/docs/http/ngx_http_realip_module.html
# ==============================================================================


# ------------------------------------------------------------------------------
# Rate limiting zones
# Defined at http-context level (this file is included inside nginx's http block)
# ------------------------------------------------------------------------------
limit_req_zone  $binary_remote_addr zone=api_limit:10m  rate=100r/m;
limit_req_zone  $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ------------------------------------------------------------------------------
# Real IP resolution
# Railway / cloud proxies forward the original client IP in X-Forwarded-For.
# Without this, $remote_addr would always be the Railway proxy IP,
# making rate limiting useless (all requests would share one bucket).
# For production VPS with known proxy IPs, replace 0.0.0.0/0 with actual subnets.
# ------------------------------------------------------------------------------
set_real_ip_from  0.0.0.0/0;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# ------------------------------------------------------------------------------
# Upstream: Go API
# keepalive 32 → reuses connections to the API container (avoid TCP handshake per req)
# ------------------------------------------------------------------------------
upstream ecommerce_api {
    server    api:8080;
    keepalive 32;
}


# ==============================================================================
# SERVER BLOCK
# ==============================================================================
server {
    listen      80;
    server_name _;

    # Hide nginx version from error pages and Server header
    server_tokens off;

    # --------------------------------------------------------------------------
    # Security headers
    # These are set here and forwarded to the client through Railway's HTTPS edge.
    # HSTS is intentionally omitted from HTTP responses - it is only meaningful
    # when delivered over a verified TLS connection to the client.
    # Railway's edge adds HSTS at the TLS layer automatically.
    # --------------------------------------------------------------------------
    add_header X-Frame-Options        "DENY"                              always;
    add_header X-Content-Type-Options "nosniff"                           always;
    add_header X-XSS-Protection       "1; mode=block"                     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # --------------------------------------------------------------------------
    # Gzip compression
    # Reduces payload size for JSON API responses significantly.
    # --------------------------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1000;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml;

    # --------------------------------------------------------------------------
    # Global proxy settings (applied to all location blocks below)
    # --------------------------------------------------------------------------
    client_max_body_size  10M;
    proxy_read_timeout    30s;
    proxy_connect_timeout 10s;
    proxy_http_version    1.1;

    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # CRITICAL: Pass the ORIGINAL protocol from Railway's edge, NOT nginx's $scheme.
    # Without this, the Go app thinks every request came in via HTTP, even though
    # the client connected via HTTPS. This breaks HTTPS-aware redirects and logs.
    # $http_x_forwarded_proto contains "https" as set by Railway's TLS edge.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Request-ID      $request_id;


    # ==========================================================================
    # ROUTES
    # ==========================================================================

    # --------------------------------------------------------------------------
    # HEALTH CHECK
    # - No rate limit: platform probes should never be throttled
    # - No access log: prevents health-check noise in logs
    # - Exact match (=): fastest lookup, no regex needed
    # NOTE: path must match the Go router exactly → /api/v1/health
    # --------------------------------------------------------------------------
    location = /api/v1/health {
        proxy_pass       http://ecommerce_api;
        proxy_set_header Connection "";
        access_log       off;
    }

    # --------------------------------------------------------------------------
    # SWAGGER UI
    # - Trailing slash matters: /swagger/ matches /swagger/index.html correctly
    # - Light rate limit to prevent scraping
    # --------------------------------------------------------------------------
    location /swagger/ {
        limit_req  zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://ecommerce_api;
    }

    # --------------------------------------------------------------------------
    # AUTH ENDPOINTS - strict rate limit (anti brute-force)
    # 10 req/min with burst of 5. Exceeds → 429 Too Many Requests.
    # Covers only login and register (token refresh has its own risk profile).
    # --------------------------------------------------------------------------
    location ~ ^/api/v1/auth/(login|register) {
        limit_req        zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        limit_conn       conn_limit 5;

        proxy_pass http://ecommerce_api;
        add_header Cache-Control "no-store" always;
    }

    # --------------------------------------------------------------------------
    # ALL API ENDPOINTS - standard rate limit
    # Connection header cleared to enable upstream keepalive properly.
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req  zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 20;

        proxy_pass       http://ecommerce_api;
        proxy_set_header Connection "";
        add_header       Cache-Control "no-store" always;
    }

    # --------------------------------------------------------------------------
    # DENY hidden files and sensitive file extensions
    # Prevents accidental exposure of .env, .git, .sql, etc.
    # --------------------------------------------------------------------------
    location ~ /\. {
        deny          all;
        access_log    off;
        log_not_found off;
    }

    location = /swagger/doc.yaml {
    proxy_pass http://ecommerce_api;
}

location ~* \.(env|sql|sh|yaml|yml|toml|git)$ {
    deny all;
    access_log off;
    log_not_found off;
}
}
