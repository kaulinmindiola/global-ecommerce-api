# ==============================================================================
# AIR - Live reload configuration for Go
# Documentation: https://github.com/air-verse/air
# ==============================================================================

root = "."
testdata_dir = "tests"
tmp_dir = "tmp"

[build]
  # Command to build the application
  cmd = "go build -o ./tmp/main ./cmd/api"

  # Binary to run after build
  bin = "./tmp/main"

  # Arguments passed to the binary
  args_bin = ["serve"]

  # Delay before triggering rebuild (milliseconds)
  delay = 1000

  # Exclude specific directories from watching
  exclude_dir = [
    "assets",
    "tmp",
    "vendor",
    "api/docs",
    "testdata",
    "tests",
  ]

  # Exclude specific file extensions
  exclude_file = []

  # Only watch these extensions
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "env"]

  # Exclude unchanged files
  exclude_unchanged = true

  # Follow symlinks
  follow_symlink = true

  # Log file for build output
  log = "tmp/build-errors.log"

  # Kill signal for the binary (SIGTERM or SIGKILL)
  kill_delay = "0s"

  # Send interrupt before kill
  send_interrupt = false

  # Rerun even if no files changed
  rerun = false

  # Stop on build error
  stop_on_error = true

[log]
  # Show timestamp in logs
  time = true

  # Show only main logs
  main_only = false

[color]
  # Colors for different log types
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Clean tmp directory on exit
  clean_on_exit = true

[screen]
  # Clear screen on rebuild
  clear_on_rebuild = true

  # Keep scroll position
  keep_scroll = true
