# ==============================================================================
# SECURITY PIPELINE - Global E-commerce API
# Triggers: PRs, pushes to main/develop, weekly schedule
# Jobs: gosec → trivy → dependency-audit
# ==============================================================================

name: 🔐 Security Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # JOB 1: GOSEC - Go Security Scanner
  # Purpose: Find security vulnerabilities in Go code
  # ============================================================================
  gosec:
    name: 🔒 GoSec Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          # Output SARIF for GitHub Security tab
          args: >-
            -no-fail
            -fmt sarif
            -out results.sarif
            -severity medium
            -confidence medium
            -exclude-dir=api/docs
            ./...

      - name: Upload SARIF file to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: gosec

      - name: Run Gosec (readable output for PR)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec \
            -severity medium \
            -confidence medium \
            -fmt text \
            -exclude-dir=api/docs \
            ./... 2>&1 | tee gosec-results.txt || true

          # Show results in step summary
          echo "## 🔒 GoSec Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 gosec-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload GoSec results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gosec-results
          path: gosec-results.txt
          retention-days: 30

  # ============================================================================
  # JOB 2: TRIVY - Container and Dependency Scanner
  # Purpose: Scan Docker image and dependencies for CVEs
  # ============================================================================
  trivy:
    name: 🛡️ Trivy Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Docker image for scanning
        run: |
          docker build \
            -f deployments/docker/Dockerfile \
            -t ecommerce-api:scan \
            .

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'  # Don't fail, just report

      - name: Run Trivy vulnerability scanner (Docker image)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'ecommerce-api:scan'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Run Trivy (table output for PR summary)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format table \
            ecommerce-api:scan 2>&1 | tee trivy-table.txt || true

          echo "## 🛡️ Trivy Scan Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat trivy-table.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: trivy-image

      - name: Upload Trivy artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: |
            trivy-fs-results.sarif
            trivy-image-results.sarif
            trivy-table.txt
          retention-days: 30

  # ============================================================================
  # JOB 3: DEPENDENCY AUDIT
  # Purpose: Check for known vulnerable dependencies
  # ============================================================================
  dependency-audit:
    name: 📦 Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          govulncheck ./... 2>&1 | tee govuln-results.txt || true

          echo "## 📦 Go Vulnerability Check Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat govuln-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check for outdated dependencies
        run: |
          go list -u -m -json all 2>/dev/null | \
            jq -r 'select(.Update != null) | "\(.Path): \(.Version) → \(.Update.Version)"' \
            | tee outdated-deps.txt || true

          if [ -s outdated-deps.txt ]; then
            echo "## ⚠️ Outdated Dependencies" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat outdated-deps.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ All dependencies are up to date" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: |
            govuln-results.txt
            outdated-deps.txt
          retention-days: 30

  # ============================================================================
  # JOB 4: SECRET SCANNING
  # Purpose: Detect accidentally committed secrets
  # ============================================================================
  secret-scan:
    name: 🔑 Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run TruffleHog (secret scanner)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true  # Don't block PR, just report

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ============================================================================
  # SUMMARY
  # ============================================================================
  security-summary:
    name: 📊 Security Summary
    runs-on: ubuntu-latest
    needs: [gosec, trivy, dependency-audit, secret-scan]
    if: always()
    steps:
      - name: Security scan summary
        run: |
          echo "## 🔐 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 GoSec | ${{ needs.gosec.result == 'success' && '✅ Passed' || '⚠️ Issues Found' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ Trivy | ${{ needs.trivy.result == 'success' && '✅ Passed' || '⚠️ Issues Found' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Dependency Audit | ${{ needs.dependency-audit.result == 'success' && '✅ Passed' || '⚠️ Issues Found' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔑 Secret Scan | ${{ needs.secret-scan.result == 'success' && '✅ Passed' || '⚠️ Issues Found' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Security issues are reported but do not block PRs. Review results in the Security tab." >> $GITHUB_STEP_SUMMARY
