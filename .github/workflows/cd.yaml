# ==============================================================================
# CD PIPELINE - Global E-commerce API
# Triggers: Push to main (after PR merge)
# Jobs: docker-build → deploy-railway → smoke-test → notify
# ==============================================================================

name: 🚀 CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

  # Allow manual trigger for emergency deploys
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip-smoke-tests:
        description: 'Skip smoke tests'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-production
  cancel-in-progress: false  # Never cancel a deploy in progress

env:
  GO_VERSION: '1.22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # JOB 1: BUILD & PUSH DOCKER IMAGE
  # Purpose: Build production image and push to GitHub Container Registry
  # ============================================================================
  docker-build:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "version=${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}-${SHORT_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=Global E-commerce API
            org.opencontainers.image.description=Multi-currency e-commerce REST API
            org.opencontainers.image.vendor=Kaulin Mindiola

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

      - name: Image summary
        run: |
          echo "## 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Registry** | \`${{ env.REGISTRY }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | \`${{ steps.push.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # JOB 2: DEPLOY TO RAILWAY
  # Purpose: Deploy to Railway (production environment)
  # ============================================================================
  deploy-railway:
    name: 🚂 Deploy to Railway
    runs-on: ubuntu-latest
    needs: docker-build
    environment:
      name: production
      url: https://global-ecommerce-api.up.railway.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway deploy \
            --service global-ecommerce-api \
            --detach
          echo "✓ Deploy initiated on Railway"

      - name: Wait for Railway deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Waiting for Railway deployment to complete..."
          sleep 30

          # Poll deployment status for up to 3 minutes
          for i in {1..18}; do
            STATUS=$(railway status --service global-ecommerce-api 2>/dev/null || echo "unknown")
            echo "Attempt ${i}/18: Status = ${STATUS}"

            if echo "$STATUS" | grep -q "ACTIVE\|SUCCESS"; then
              echo "✓ Deployment successful!"
              break
            elif echo "$STATUS" | grep -q "FAILED\|ERROR"; then
              echo "::error::Deployment failed!"
              exit 1
            fi

            sleep 10
          done

      - name: Deploy summary
        run: |
          echo "## 🚂 Railway Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | https://global-ecommerce-api.up.railway.app |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ needs.docker-build.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Swagger UI** | https://global-ecommerce-api.up.railway.app/swagger |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # JOB 3: SMOKE TESTS
  # Purpose: Verify production deployment is working correctly
  # ============================================================================
  smoke-tests:
    name: 💨 Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-railway
    if: ${{ !inputs.skip-smoke-tests }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for service to be ready
        run: |
          echo "Waiting for service to be ready..."
          sleep 20

      - name: Run smoke tests
        env:
          BASE_URL: https://global-ecommerce-api.up.railway.app
        run: |
          echo "Running smoke tests against: ${BASE_URL}"
          echo ""

          # Test 1: Health check
          echo "→ Test 1: Health Check"
          HEALTH=$(curl -sf "${BASE_URL}/health" -w "\n%{http_code}")
          HTTP_CODE=$(echo "$HEALTH" | tail -1)
          BODY=$(echo "$HEALTH" | head -1)

          if [ "$HTTP_CODE" == "200" ]; then
            echo "  ✅ Health check passed (${HTTP_CODE})"
          else
            echo "  ❌ Health check failed (${HTTP_CODE})"
            echo "  Response: ${BODY}"
            exit 1
          fi

          # Test 2: Version endpoint
          echo "→ Test 2: Version Endpoint"
          VERSION=$(curl -sf "${BASE_URL}/version" -w "\n%{http_code}")
          HTTP_CODE=$(echo "$VERSION" | tail -1)

          if [ "$HTTP_CODE" == "200" ]; then
            echo "  ✅ Version endpoint passed (${HTTP_CODE})"
          else
            echo "  ❌ Version endpoint failed (${HTTP_CODE})"
            exit 1
          fi

          # Test 3: API v1 currencies
          echo "→ Test 3: Currencies Endpoint"
          CURRENCIES=$(curl -sf "${BASE_URL}/api/v1/currencies" -w "\n%{http_code}")
          HTTP_CODE=$(echo "$CURRENCIES" | tail -1)

          if [ "$HTTP_CODE" == "200" ]; then
            echo "  ✅ Currencies endpoint passed (${HTTP_CODE})"
          else
            echo "  ❌ Currencies endpoint failed (${HTTP_CODE})"
            exit 1
          fi

          # Test 4: Products endpoint
          echo "→ Test 4: Products Endpoint"
          PRODUCTS=$(curl -sf "${BASE_URL}/api/v1/products" -w "\n%{http_code}")
          HTTP_CODE=$(echo "$PRODUCTS" | tail -1)

          if [ "$HTTP_CODE" == "200" ]; then
            echo "  ✅ Products endpoint passed (${HTTP_CODE})"
          else
            echo "  ❌ Products endpoint failed (${HTTP_CODE})"
            exit 1
          fi

          # Test 5: Swagger UI
          echo "→ Test 5: Swagger UI"
          SWAGGER=$(curl -sf "${BASE_URL}/swagger/index.html" -w "\n%{http_code}")
          HTTP_CODE=$(echo "$SWAGGER" | tail -1)

          if [ "$HTTP_CODE" == "200" ]; then
            echo "  ✅ Swagger UI passed (${HTTP_CODE})"
          else
            echo "  ❌ Swagger UI failed (${HTTP_CODE})"
            exit 1
          fi

          # Test 6: Unauthorized endpoint returns 401
          echo "→ Test 6: Auth Guard"
          AUTH=$(curl -s "${BASE_URL}/api/v1/orders" -w "\n%{http_code}")
          HTTP_CODE=$(echo "$AUTH" | tail -1)

          if [ "$HTTP_CODE" == "401" ]; then
            echo "  ✅ Auth guard working (${HTTP_CODE})"
          else
            echo "  ❌ Auth guard failed - expected 401, got ${HTTP_CODE}"
            exit 1
          fi

          echo ""
          echo "✅ All smoke tests passed!"

      - name: Smoke test summary
        if: always()
        run: |
          echo "## 💨 Smoke Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Endpoint | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check | \`/health\` | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`/version\` | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Currencies | \`/api/v1/currencies\` | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Products | \`/api/v1/products\` | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Swagger UI | \`/swagger\` | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Auth Guard | \`/api/v1/orders\` | ✅ |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # JOB 4: CREATE GITHUB RELEASE
  # Purpose: Tag the release with version and changelog
  # ============================================================================
  release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    needs: [docker-build, smoke-tests]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline --no-merges | head -20)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --oneline --no-merges)
          fi

          # Format changelog
          CHANGELOG="## Changes\n\n"
          while IFS= read -r line; do
            CHANGELOG="${CHANGELOG}- ${line}\n"
          done <<< "$COMMITS"

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.docker-build.outputs.version }}
          name: "Release ${{ needs.docker-build.outputs.version }}"
          body: |
            ## 🚀 Production Release

            **Version:** `${{ needs.docker-build.outputs.version }}`
            **Deployed to:** https://global-ecommerce-api.up.railway.app
            **Swagger UI:** https://global-ecommerce-api.up.railway.app/swagger
            **Docker Image:** `ghcr.io/${{ github.repository }}:latest`

            ${{ steps.changelog.outputs.changelog }}

            ### 🐳 Docker Image
            ```bash
            docker pull ghcr.io/${{ github.repository }}:latest
            ```

            ### 📦 Image Digest
            `${{ needs.docker-build.outputs.image-digest }}`
          draft: false
          prerelease: false
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # JOB 5: NOTIFY
  # Purpose: Notify team of deployment result
  # ============================================================================
  notify:
    name: 🔔 Notify
    runs-on: ubuntu-latest
    needs: [docker-build, deploy-railway, smoke-tests, release]
    if: always()

    steps:
      - name: Deployment notification
        run: |
          # Overall status
          DEPLOY_STATUS="✅ SUCCESS"
          if [ "${{ needs.smoke-tests.result }}" == "failure" ]; then
            DEPLOY_STATUS="❌ FAILED (Smoke Tests)"
          elif [ "${{ needs.deploy-railway.result }}" == "failure" ]; then
            DEPLOY_STATUS="❌ FAILED (Deploy)"
          elif [ "${{ needs.docker-build.result }}" == "failure" ]; then
            DEPLOY_STATUS="❌ FAILED (Docker Build)"
          fi

          echo "## 🚀 Deployment Result: ${DEPLOY_STATUS}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Docker Build | ${{ needs.docker-build.result == 'success' && '✅' || '❌' }} ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚂 Railway Deploy | ${{ needs.deploy-railway.result == 'success' && '✅' || '❌' }} ${{ needs.deploy-railway.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 💨 Smoke Tests | ${{ needs.smoke-tests.result == 'success' && '✅' || '❌' }} ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Release | ${{ needs.release.result == 'success' && '✅' || '❌' }} ${{ needs.release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ needs.docker-build.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Production URL:** https://global-ecommerce-api.up.railway.app" >> $GITHUB_STEP_SUMMARY
