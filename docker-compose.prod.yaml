# ==============================================================================
# DOCKER COMPOSE - PRODUCTION STACK
# Global E-commerce API
#
# Usage:
#   export IMAGE_TAG=$(git rev-parse --short HEAD)
#   docker compose -f docker-compose.prod.yaml up -d
#
# SSL/TLS Strategy:
#   TLS is handled at the edge (Railway / Load Balancer), NOT in this stack.
#   Nginx operates in HTTP proxy mode on port 80.
#   For VPS self-hosted with TLS, use:
#     docker compose -f docker-compose.prod.yaml -f docker-compose.prod.ssl.yaml up -d
#
# Security:
#   - All services on isolated internal network
#   - Only nginx exposed externally (port 80)
#   - No secrets in this file (use .env.production)
#   - Resource limits enforced
# ==============================================================================

services:
  # ============================================================================
  # API SERVICE - Go Application
  # ============================================================================
  api:
    image: "ghcr.io/kaulinmindiola/global-ecommerce-api:${IMAGE_TAG:?Error - IMAGE_TAG is required. Run: export IMAGE_TAG=$(git rev-parse --short HEAD)}"
    restart: unless-stopped

    env_file:
      - .env.production

    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      LOG_FORMAT: json
      LOG_LEVEL: info
      TZ: UTC
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable # SSL handled at Railway edge, not DB layer locally
      REDIS_HOST: redis
      REDIS_PORT: "6379"

    healthcheck:
      test: ["CMD", "/app/ecommerce-api", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=50m,noexec,nosuid

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - ecommerce-internal

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=api"

  # ============================================================================
  # NGINX - Reverse Proxy (HTTP mode, TLS terminated at Railway edge)
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: ecommerce-nginx-prod
    restart: unless-stopped

    ports:
      - "80:80"
      # Port 443 intentionally absent.
      # Railway's edge proxy handles TLS and routes to this port 80.
      # For VPS with self-managed TLS, add docker-compose.prod.ssl.yaml overlay.

    volumes:
      - ${PWD}/deployments/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx

    healthcheck:
      # Two-stage check:
      # 1. nginx -t validates config syntax
      # 2. wget verifies the proxy is actually routing traffic to the API
      test:
        [
          "CMD-SHELL",
          "nginx -t && wget --quiet --tries=1 --spider http://127.0.0.1/api/v1/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

    security_opt:
      - no-new-privileges:true

    depends_on:
      api:
        condition: service_healthy

    networks:
      - ecommerce-internal
      - ecommerce-frontend

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=nginx"

  # ============================================================================
  # POSTGRES SERVICE
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    env_file:
      - .env.production

    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8 --auth-host=scram-sha-256"
      TZ: UTC
      PGDATA: /var/lib/postgresql/data/pgdata

    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=2621kB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c log_min_duration_statement=1000
      -c log_connections=on
      -c log_disconnections=on

    volumes:
      - postgres_prod_data:/var/lib/postgresql/data/pgdata
      - postgres_prod_logs:/var/log/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

    security_opt:
      - no-new-privileges:true

    expose:
      - "5432"

    networks:
      - ecommerce-internal

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
        labels: "service=postgres"

  # ============================================================================
  # REDIS SERVICE
  # ============================================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped

    env_file:
      - .env.production

    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Error - REDIS_PASSWORD is required in .env.production}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 300
      --protected-mode yes
      --loglevel notice
      --save 900 1
      --save 300 10
      --save 60 10000

    volumes:
      - redis_prod_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

    security_opt:
      - no-new-privileges:true

    expose:
      - "6379"

    networks:
      - ecommerce-internal

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
        labels: "service=redis"

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  postgres_prod_data:
  postgres_prod_logs:
  redis_prod_data:
  nginx_logs:
  # nginx_ssl intentionally removed.
  # SSL/TLS is NOT managed in this stack.
  # See docker-compose.prod.ssl.yaml for VPS/self-hosted TLS overlay.

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  # Internal network: api, postgres, redis, nginx communicate here
  # Marked internal=true: containers on this network cannot reach the internet
  ecommerce-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.0.0/24

  # Frontend network: only nginx is here, facing the outside world
  ecommerce-frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
